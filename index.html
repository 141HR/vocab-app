<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="单词卡片：多卡组管理、SM-2 间隔重复复习、学习统计，数据保存在浏览器本地。" />
  <title>单词卡片</title>
  <script>
    // Force light theme
    (function () {
      document.documentElement.dataset.theme = 'light';
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
  <div class="app">
    <header class="app__header">
      <h1 class="app__title">
        <svg class="app__title-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3"></rect>
          <path d="M7 15V9"></path>
          <path d="M12 15V9"></path>
          <path d="M17 15V9"></path>
        </svg>
        <span>单词卡片</span>
      </h1>
      <nav class="app__nav" aria-label="主导航">
        <a class="nav-link" href="#/decks" data-nav="decks">卡组</a>
        <a class="nav-link" href="#/stats" data-nav="stats">统计</a>
        <button class="btn btn--ghost theme-toggle-btn" type="button" id="theme-toggle" data-action="theme-toggle" aria-pressed="false" style="display:none;">🌙 深色</button>
      </nav>
    </header>

    <div id="storage-warning" class="alert" role="alert" hidden>
      <p class="alert__text" id="storage-warning-text"></p>
      <button class="btn btn--small" type="button" data-action="storage-retry">重试写入</button>
    </div>

    <main id="view" class="view">
      <p class="empty">正在加载…</p>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-text" class="toast__text"></span>
    <button class="toast__undo" type="button" id="undo-btn" data-action="undo" hidden>撤销</button>
  </div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
